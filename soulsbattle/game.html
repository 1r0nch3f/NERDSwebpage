<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soulslike Boss Battle</title>
<!--
  Soulslike Boss Battle (client build, started 2026-11-22). A dark-fantasy chat boss fight for a Twitch stream.
  Original bosses, knights and art (AI-made locally, finished by NERDS). No Dark Souls names, characters, art, music or logo.

  OBS: Browser source, width 1920, height 300 (scale it to fit the canvas). Reads Twitch chat anonymously (never posts,
  no login, no bot). URL: boss-battle.html?channel=YOURCHANNEL   Testing: ?demo=1   Transparent sky: ?bg=0

  Sound effects: ?sfxvol=0.6 (default) or ?nosfx=1. All from CC0 public-domain packs (opengameart.org), free for commercial use.
  Voice: ?vol=0.8 or ?mute=1. Boss voices: tick 'Control audio via OBS' on the browser source so the lines go through the OBS mixer.

  Chat commands:
    !join (or !rise)   join the fight for good (remembered); !leave to leave
    !knight 1-8        pick your look (otherwise a look is picked from your name, the same every stream)
    !praise            PRAISE THE SUN: heals your knight once per boss
    !summon            broadcaster only: a golden phantom joins the fight for 60 seconds
  The fight is automatic: knights attack, roll, parry and die on their own. Bosses have two phases, a big telegraphed
  sweep, a grab (parry it or die) and quick hits. Win = BOSS SLAIN, wipe = YOU DIED. Bosses level up (NG+) when beaten.
  Spirits (NPC knights) fill the party up to 3 while few viewers have joined.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 1920px; height: 300px; position: relative; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="300"></canvas>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const CHANNEL = (Q.get('channel') || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
const DEMO = Q.has('demo');
const SKY = Q.get('bg') !== '0';
const W = 1920, H = 300, FLOOR = 246, BOSS_X = 1690;
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const FONT = "'Cinzel', Georgia, serif";

const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const now = () => performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = 'soulsbb-';
const load = (k, d) => { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { if (DEMO) return; try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} };
const loadImg = src => { const im = new Image(); im.src = src; return im; };
const ok = im => im && im.complete && im.naturalWidth > 0;

// ---------------------------------------------------------------- art
const KNIGHTS = [
  { id: 'k1', kind: 'melee', dmg: [7, 11] },  { id: 'k2', kind: 'melee', dmg: [7, 11] },
  { id: 'k3', kind: 'quick', dmg: [4, 7] },   { id: 'k4', kind: 'magic', dmg: [6, 10] },
  { id: 'k5', kind: 'heavy', dmg: [12, 18] }, { id: 'k6', kind: 'cleric', dmg: [4, 7] },
  { id: 'k7', kind: 'melee', dmg: [7, 11] },  { id: 'k8', kind: 'fire', dmg: [6, 10] },
];
for (const k of KNIGHTS) k.img = loadImg('assets/knights/' + k.id + '.png');
const BOSSES = [
  { key: 'graveknight', name: 'Vaelric, the Grave Knight', sweep: 'GRAVE CLEAVE', grab: 'EXECUTION', quick: 'SHIELD BASH', aura: '#7fb4ff', rise: 'THE GRAVE WILL NOT HOLD HIM' },
  { key: 'ashwitch',    name: 'Morwen of the Cinders',     sweep: 'CINDER STORM', grab: 'IMMOLATE', quick: 'EMBER BOLT', aura: '#ff8a2a', rise: 'THE ASHES REKINDLE' },
  { key: 'rotdragon',   name: 'Grimscale the Rotting Wyrm', sweep: 'ROT BREATH', grab: 'DEVOUR', quick: 'TAIL LASH', aura: '#8cff5a', rise: 'THE ROT SPREADS' },
  { key: 'bellkeeper',  name: 'The Bell-Helm Brute',       sweep: 'TOLLING SLAM', grab: 'CHAIN DRAG', quick: 'HAMMER SWING', aura: '#e0b060', rise: 'THE BELL TOLLS FOR THEE' },
  { key: 'bloodsaint',  name: 'Saint Ilsabeth, the Bled',  sweep: 'CRIMSON RAIN', grab: 'IMPALE', quick: 'THORN LANCE', aura: '#ff3a4a', rise: 'HER BLOOD RUNS GOLD' },
  { key: 'abyssbeast',  name: 'The Thing in the Deep Water', sweep: 'TIDE OF DARK', grab: 'DRAG BELOW', quick: 'TENDRIL', aura: '#b070ff', rise: 'IT OPENS EVERY EYE' },
  { key: 'wolfknight',  name: 'Fenrath, the Moon-Mad',     sweep: 'HOWLING ARC', grab: 'MAUL', quick: 'CLEAVER', aura: '#cfe0ff', rise: 'THE MOON TAKES HIM' },
  { key: 'kingofbones', name: 'The Crownless King',        sweep: 'BONE TIDE', grab: 'ROYAL DECREE', quick: 'SCEPTER STRIKE', aura: '#5ad8ff', rise: 'KNEEL BEFORE THE CROWNLESS' },
];
for (const b of BOSSES) b.img = loadImg('assets/bosses/' + b.key + '.png');
// boss voice lines: voice/<key>-intro|rise|wipe|slain.ogg (OBS: tick 'Control audio via OBS' to mix it). ?mute=1 silences, ?vol=0.8 sets volume
const VOL = Q.has('mute') ? 0 : clamp(parseFloat(Q.get('vol') || '0.9'), 0, 1);
function say(kind) { if (!VOL) return; try { const a = new Audio('voice/' + boss.key + '-' + kind + '.ogg'); a.volume = VOL; a.play().catch(() => {}); } catch (e) {} }
// sound effects: sfx/<name><n>.ogg, CC0 (public domain) packs from opengameart.org. ?sfxvol=0.6 sets volume, ?nosfx=1 turns them off
const SFXVOL = (Q.has('mute') || Q.has('nosfx')) ? 0 : clamp(parseFloat(Q.get('sfxvol') || '0.6'), 0, 1);
const SFX = { swing: 6, roll: 3, hit: 10, crit: 4, parry: 4, hurt: 10, death: 11, growl: 7, snarl: 11, roar: 1, bossdeath: 1, toll: 1, boom: 1, heal: 1 };
const SFX_GAP = { swing: 90, hit: 90, crit: 120, hurt: 140, roll: 120, death: 120, heal: 400, growl: 300, snarl: 600 };
const sfxLast = {}; let sfxLive = 0, fireA = null;
function sfx(name, vol) {
  const n = SFX[name]; if (!SFXVOL || !n) return;
  const tn = now(); if (tn - (sfxLast[name] || 0) < (SFX_GAP[name] || 0) || sfxLive >= 8) return;
  sfxLast[name] = tn;
  try {
    const a = new Audio('sfx/' + name + (n > 1 ? ri(1, n) : '') + '.ogg'); a.volume = clamp(SFXVOL * (vol || 1), 0, 1);
    let done = false; const fin = () => { if (!done) { done = true; sfxLive--; } };
    sfxLive++; a.onended = fin; a.onerror = fin; a.play().catch(fin);
  } catch (e) {}
}
function fireLoop(on) {
  if (!SFXVOL) return;
  try { if (!fireA) { fireA = new Audio('sfx/fire.ogg'); fireA.loop = true; } fireA.volume = clamp(SFXVOL * 0.5, 0, 1); if (on) fireA.play().catch(() => {}); else fireA.pause(); } catch (e) {}
}
const KNIGHT_H = 96, BOSS_H = 230;

// tinted copies of a sprite (ghost, gold, flash), cached per image
const tintCache = new Map();
function tinted(img, color, alpha) {
  const k = img.src + color + alpha;
  if (tintCache.has(k)) return tintCache.get(k);
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-atop'; x.globalAlpha = alpha; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  tintCache.set(k, c); return c;
}

// ---------------------------------------------------------------- party
const BOTS = new Set(['nightbot', 'streamelements', 'streamlabs', 'moobot', 'fossabot', 'wizebot', 'sery_bot', 'commanderroot',
  'soundalerts', 'kofistreambot', 'pokemoncommunitygame', 'streamstickers', 'blerp', 'botrixoficial', 'own3d']);
const isBot = l => BOTS.has(l) || /bot$/.test(l) || /^justinfan/.test(l);
function seeded(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }

let party = new Set(load('party', []));
let looks = load('looks', {});
const knights = new Map();
let seq = 0;

function lookFor(id) { return KNIGHTS[(looks[id] || (Math.floor(seeded(id) * 8) + 1)) - 1]; }
function newKnight(id, name, extra) {
  return Object.assign({ id, name, x: -60, tx: 0, hp: 100, max: 100, down: false, deadT: 0, nextAct: now() + rnd(1000, 3000),
    dmg: 0, lungeT: 0, hurtT: 0, rollT: 0, praised: false, seq: seq++, look: lookFor(id), chatter: false }, extra || {});
}
function join(login, display, chatter) {
  if (isBot(login) || !party.has(login)) return null;
  let k = knights.get(login);
  if (!k) {
    k = newKnight(login, display || login);
    if (phase === 'fight') { k.down = false; bossMax += 140; bossHP += 140; }
    knights.set(login, k); layout();
  }
  if (display) k.name = display;
  if (chatter) k.chatter = true;
  return k;
}
function leave(login) { const k = knights.get(login); if (k && !k.chatter) { knights.delete(login); layout(); } }
const real = () => [...knights.values()].filter(k => !k.npc && !k.phantom);
const SPIRITS = 3;
function keepSpirits() {
  const want = Math.max(0, SPIRITS - real().length);
  const have = [...knights.values()].filter(k => k.npc).sort((a, b) => a.seq - b.seq);
  if (have.length < want) {
    for (let n = 1; n <= SPIRITS && have.length < want; n++) {
      const id = '__spirit' + n; if (knights.has(id)) continue;
      const k = newKnight(id, 'SPIRIT ' + n, { npc: true, seq: 1e6 + n }); k.look = KNIGHTS[(n * 3) % 8];
      knights.set(id, k); have.push(k);
    }
    layout();
  } else if (have.length > want) {
    for (const k of have.slice(want)) { floater(k.name + ' FADES', k.x, FLOOR - 110, '#9fb3c8', 16); knights.delete(k.id); }
    layout();
  }
}
function layout() {
  const list = [...knights.values()].sort((a, b) => ((a.npc ? 1 : 0) - (b.npc ? 1 : 0)) || (a.seq - b.seq)).slice(0, 20);
  const shown = new Set(list);
  list.forEach((k, i) => { k.row = i >= 10 ? 1 : 0; k.tx = 1340 - (i % 10) * 118 - k.row * 58; k.shown = true; });
  for (const k of knights.values()) if (!shown.has(k)) k.shown = false;
}
const shown = () => [...knights.values()].filter(k => k.shown);
const alive = () => shown().filter(k => !k.down);

// ---------------------------------------------------------------- state
let levels = load('levels', {});
const ng = b => levels[b.key] || 0;
const today = new Date().toDateString();
let deaths = load('deaths', { day: today, n: 0 });
if (deaths.day !== today) deaths = { day: today, n: 0 };

let phase = 'lobby', boss = BOSSES[0], bossIdx = 0, bossHP = 1, bossMax = 1, p2 = false, p2T = 0;
let lobbyEnd = 0, fightEnd = 0, endT = 0, endWin = false, banner = null, shake = 0, bossHitT = 0, bossStagT = 0, bossAtkT = 0;
let nextQuick = 0, nextSweep = 0, nextGrab = 0, sweep = null, grab = null, phantomEnd = 0;
const shots = [], floaters = [], parts = [], stains = [];
const BREAK = DEMO ? 7000 : 20000;
let bag = [];
function nextBoss(cur) {
  const ready = BOSSES.map((b, i) => i).filter(i => ok(BOSSES[i].img));
  const pool = ready.length ? ready : BOSSES.map((b, i) => i);
  bag = bag.filter(i => pool.includes(i) && i !== cur);
  if (!bag.length) { bag = pool.slice().sort(() => Math.random() - 0.5); if (bag.length > 1 && bag[0] === cur) bag.push(bag.shift()); }
  const i = bag.shift(); save('last', BOSSES[i].key); return i;
}
function floater(text, x, y, color, size, life) { floaters.push({ text, x, y, color, size: size || 18, t0: now(), life: life || 1600 }); }

function startLobby() {
  phase = 'lobby'; boss = BOSSES[bossIdx]; p2 = false; sweep = null; grab = null; bossHP = bossMax = 1;
  lobbyEnd = now() + BREAK;
  for (const k of knights.values()) { k.down = false; k.hp = k.max; k.dmg = 0; k.praised = false; }
  stains.length = 0; fireLoop(true);
  banner = { title: 'BONFIRE LIT', sub: 'TYPE !join TO RISE  //  NEXT: ' + boss.name.toUpperCase(), until: now() + 5000, color: '#ffb347' };
}
function startFight() {
  phase = 'fight'; p2 = false;
  const n = Math.max(1, real().filter(k => k.shown).length);
  bossMax = bossHP = Math.round((160 + 240 * n) * (1 + 0.2 * ng(boss)));
  fightEnd = now() + 5 * 60000;
  nextQuick = now() + rnd(4000, 6000); nextSweep = now() + rnd(13000, 17000); nextGrab = now() + rnd(19000, 26000);
  for (const k of knights.values()) { k.dmg = 0; k.nextAct = now() + rnd(600, 2600); }
  banner = { title: boss.name, sub: ng(boss) ? 'NEW GAME +' + ng(boss) : '', until: now() + 4200, color: '#e8dcc0', big: true };
  say('intro'); fireLoop(false); sfx('boom', 0.7);
}
function endFight(win) {
  phase = 'end'; endWin = win; endT = now(); sweep = null; grab = null;
  const vk = win ? 'slain' : 'wipe'; setTimeout(() => say(vk), 1200); sfx(win ? 'bossdeath' : 'toll');
  if (win) {
    levels[boss.key] = ng(boss) + 1; save('levels', levels);
    const mvp = real().sort((a, b) => b.dmg - a.dmg)[0];
    banner = { title: 'BOSS SLAIN', sub: mvp && mvp.dmg ? 'MVP: ' + mvp.name.toUpperCase() + ' (' + mvp.dmg + ' DAMAGE)' : '', until: now() + 9000, color: '#e8c060', slain: true };
    for (let i = 0; i < 90; i++) parts.push({ x: BOSS_X + rnd(-90, 90), y: FLOOR - rnd(0, BOSS_H), vx: rnd(-20, 20), vy: rnd(-90, -30), t0: now(), life: rnd(1500, 3200), c: pick(['#ffd27a', '#ffb347', '#fff2c0', boss.aura]), r: rnd(2, 5) });
  } else {
    banner = { title: 'YOU DIED', sub: boss.name.toUpperCase() + ' CLAIMS ANOTHER PARTY', until: now() + 9000, color: '#b01a1a', died: true };
  }
  bossIdx = nextBoss(bossIdx);
}

// ---------------------------------------------------------------- combat
function hitBoss(k, dmg, crit, label) {
  if (phase !== 'fight') return;
  bossHP = Math.max(0, bossHP - dmg); bossHitT = now();
  if (!k.npc) k.dmg += dmg;
  if (crit) sfx('crit'); else sfx('hit', 0.75);
  floater((crit ? (label || 'CRITICAL') + ' ' : '') + dmg, BOSS_X - 60 + rnd(-40, 40), FLOOR - BOSS_H * 0.6 + rnd(-30, 30), crit ? '#ffd27a' : '#f0e6d0', crit ? 26 : 18, 1100);
  for (let i = 0; i < (crit ? 14 : 6); i++) parts.push({ x: BOSS_X - 70, y: FLOOR - BOSS_H * 0.5 + rnd(-30, 30), vx: rnd(-160, 40), vy: rnd(-120, 60), t0: now(), life: rnd(250, 500), c: crit ? '#ffd27a' : '#fff', r: rnd(1.5, 3) });
  if (!p2 && bossHP <= bossMax / 2 && bossHP > 0) {
    p2 = true; p2T = now(); shake = now() + 900; sweep = null; grab = null;
    nextQuick = now() + 4000; nextSweep = now() + 9000; nextGrab = now() + 15000;
    say('rise'); sfx('roar', 0.8);
    banner = { title: boss.rise, sub: boss.name.toUpperCase() + ' ENTERS ITS SECOND FORM', until: now() + 3800, color: boss.aura, big: true };
  }
  if (bossHP <= 0) endFight(true);
}
function act(k, tn) {
  const lastOne = alive().length === 1 && shown().length > 1;
  const critP = (lastOne ? 0.35 : 0.1) + (k.phantom ? 0.2 : 0);
  const crit = Math.random() < critP;
  const [a, b] = k.look.dmg;
  let dmg = ri(a, b) * (crit ? 3 : 1) * (k.phantom ? 2 : 1);
  if (k.look.kind === 'cleric' && Math.random() < 0.45) {
    const hurt = alive().filter(o => o.hp < o.max).sort((x, y) => x.hp - y.hp)[0];
    if (hurt) { sfx('heal', 0.35); hurt.hp = Math.min(hurt.max, hurt.hp + 25); floater('+25', hurt.x, FLOOR - 120, '#ffe9a0', 18); glow(hurt.x, FLOOR - 50, '#ffe9a0'); k.nextAct = tn + rnd(2200, 3600); return; }
  }
  if (k.look.kind === 'magic' || k.look.kind === 'fire') {
    const x0 = k.x + 30, y0 = FLOOR - 62 - k.row * 10;
    shots.push({ x0, y0, x1: BOSS_X - 70, y1: FLOOR - BOSS_H * 0.5 + rnd(-25, 25), t0: tn, dur: (BOSS_X - x0) / 0.9, k, dmg, crit, fire: k.look.kind === 'fire' });
  } else {
    sfx('swing', 0.7); k.lungeT = tn; k.lungeDmg = dmg; k.lungeCrit = crit; k.lungeHit = false;
  }
  const speed = k.look.kind === 'heavy' ? [3400, 5200] : k.look.kind === 'quick' ? [1300, 2200] : [2000, 3600];
  k.nextAct = tn + rnd(speed[0], speed[1]);
}
function glow(x, y, c) { for (let i = 0; i < 10; i++) parts.push({ x: x + rnd(-20, 20), y: y + rnd(-30, 20), vx: rnd(-10, 10), vy: rnd(-60, -20), t0: now(), life: rnd(500, 900), c, r: rnd(2, 3.5) }); }
function hurt(k, dmg, tn, what) {
  if (k.down) return;
  if (k.phantom) dmg = Math.round(dmg * 0.4);
  k.hp -= dmg; k.hurtT = tn;
  if (k.hp > 0) sfx('hurt', 0.8);
  floater('-' + dmg, k.x + rnd(-8, 8), FLOOR - 112 + k.row * 10, '#ff6a5a', 18, 1000);
  if (k.hp <= 0) die(k, tn, what);
}
function die(k, tn) {
  k.hp = 0; k.down = true; k.deadT = tn; sfx('death');
  if (!k.npc && !k.phantom) { deaths.n++; deaths.day = today; save('deaths', deaths); }
  if (grab && grab.k === k) grab = null;
  stains.push({ x: k.x, row: k.row });
  floater(k.name.toUpperCase() + ' DIED', k.x, FLOOR - 128 - (floaters.filter(f => tn - f.t0 < 500).length % 3) * 16, '#c02020', 17, 2200);
  if (!alive().length && phase === 'fight') setTimeout(() => { if (phase === 'fight' && !alive().length) endFight(false); }, 900);
}
const rollChance = () => (p2 ? 0.3 : 0.4);
function bossAI(tn) {
  const sp = p2 ? 1.35 : 1, dm = (p2 ? 1.25 : 1) * (1 + 0.1 * ng(boss));
  if (tn < p2T + 2200 || tn < bossStagT) return;
  if (!sweep && !grab && tn > nextQuick) {
    const v = pick(alive()); if (v) {
      bossAtkT = tn; sfx('growl', 0.8);
      shots.push({ x0: BOSS_X - 80, y0: FLOOR - BOSS_H * 0.55, x1: v.x, y1: FLOOR - 50 - v.row * 10, t0: tn, dur: 380, boss: true, v, dmg: Math.round(rnd(14, 24) * dm) });
      floater(boss.quick, BOSS_X - 120, FLOOR - BOSS_H - 6, boss.aura, 15, 900);
    }
    nextQuick = tn + rnd(3200, 6000) / sp;
  }
  if (!sweep && !grab && tn > nextSweep) {
    sweep = { t0: tn, wind: 1500, x: BOSS_X - 60, hit: new Set(), dmg: Math.round(rnd(30, 48) * dm) };
    banner = { title: boss.sweep, sub: '', until: tn + 1500, color: boss.aura, small: true }; sfx('snarl');
    nextSweep = tn + rnd(13000, 19000) / sp;
  }
  if (!sweep && !grab && tn > nextGrab) {
    const v = pick(alive().filter(k => !k.phantom)); if (v) { grab = { k: v, t0: tn, wind: 2300 }; sfx('snarl', 0.8); floater(boss.grab, v.x, FLOOR - 150, '#ff3a3a', 20, 2300); }
    nextGrab = tn + rnd(18000, 26000) / sp;
  }
}

// ---------------------------------------------------------------- chat
function onChat(login, display, text) {
  const clean = String(text || '').replace(/[^ -~]/g, ' ').trim().toLowerCase();
  const m = clean.match(/^!?(join|rise|leave|knight|praise|summon)\s*(\d)?/);
  if (!m || !clean.startsWith('!')) { join(login, display, true); return; }
  const cmd = m[1], arg = m[2];
  if (cmd === 'join' || cmd === 'rise') {
    if (isBot(login)) return;
    const isNew = !party.has(login); party.add(login); save('party', [...party]);
    const k = join(login, display, true); if (k && isNew) floater((k.name + ' HAS RISEN').toUpperCase(), k.tx, FLOOR - 136 - (floaters.filter(f => now() - f.t0 < 1200).length % 3) * 18, '#ffb347', 16, 2200);
  } else if (cmd === 'leave') {
    party.delete(login); save('party', [...party]); const k = knights.get(login);
    if (k) { floater((k.name + ' WENT HOLLOW').toUpperCase(), k.x, FLOOR - 130, '#9fb3c8', 16); knights.delete(login); layout(); }
  } else if (cmd === 'knight') {
    const n = +arg; if (!party.has(login) || !(n >= 1 && n <= 8)) return;
    looks[login] = n; save('looks', looks); const k = join(login, display, true);
    if (k) { k.look = KNIGHTS[n - 1]; floater((k.name + ' CHANGED ARMOR').toUpperCase(), k.x, FLOOR - 130, '#e8dcc0', 15); }
  } else if (cmd === 'praise') {
    const k = join(login, display, true);
    if (k && phase === 'fight' && !k.down && !k.praised) { k.praised = true; k.hp = Math.min(k.max, k.hp + 40); k.praiseT = now(); sfx('heal'); floater('PRAISE THE SUN', k.x, FLOOR - 140, '#ffd24a', 20, 2000); glow(k.x, FLOOR - 50, '#ffd24a'); }
  } else if (cmd === 'summon') {
    if (login !== CHANNEL || phase !== 'fight' || knights.has('__phantom')) return;
    const k = newKnight('__phantom', 'PHANTOM ' + (display || login).toUpperCase(), { phantom: true, max: 200, hp: 200, seq: -1 }); k.look = KNIGHTS[0];
    knights.set('__phantom', k); layout(); phantomEnd = now() + 60000; shake = now() + 300; sfx('heal'); sfx('boom', 0.5);
    banner = { title: 'PHANTOM SUMMONED', sub: (display || login).toUpperCase() + ' HAS ANSWERED THE CALL', until: now() + 3000, color: '#ffd27a', small: true };
  }
}

// ---------------------------------------------------------------- update
let last = now();
function update() {

    g.save(); g.globalAlpha = e > 0.7 ? (1 - e) / 0.3 : 1; text(f.text, f.x, f.y - e * 26, f.size, f.color, 'center', 700); g.restore(); }
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawUI(tn);
  requestAnimationFrame(frame);
}
